<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      width: 700px; height: 700px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .dialog {
      position: relative;
      width: 90%;
      max-width: 480px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), transparent);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .title-bar span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .title-bar-btns {
      display: flex;
      gap: 6px;
    }

    .title-bar-btns div {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-close { background: #ef4444; }
    .btn-min   { background: #facc15; }
    .btn-max   { background: #22c55e; }

    .body {
      padding: 32px 28px;
      text-align: center;
    }

    .error-icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.15); }
      50%      { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
    }

    .error-code {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.4));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .error-desc {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }

    .error-path {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      font-size: 11px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
      word-break: break-all;
    }

    .btn {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(59,130,246,0.2);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
      min-width: 44px;
    }

    .btn:hover {
      background: rgba(59,130,246,0.35);
      border-color: rgba(59,130,246,0.4);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .footer {
      padding: 12px 28px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }

    .footer span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="title-bar">
      <span>⚠ System Error</span>
      <div class="title-bar-btns">
        <div class="btn-min"></div>
        <div class="btn-max"></div>
        <div class="btn-close"></div>
      </div>
    </div>

    <div class="body">
      <div class="error-icon">✕</div>
      <div class="error-code">404</div>
      <div class="error-title">Page Not Found</div>
      <div class="error-desc">
        The requested resource could not be located on this system.<br>
        It may have been moved, deleted, or never existed.
      </div>
      <div class="error-path" id="path"></div>
      <br><br>
      <a href="/" class="btn">← Return to Desktop</a>
    </div>

    <div class="footer">
      <span>Maximiv OS v.2.5 • Error Handler</span>
    </div>
  </div>

  <script>
    document.getElementById('path').textContent = window.location.pathname;
  </script>
</body>
</html>
